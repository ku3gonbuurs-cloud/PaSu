<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaSu収支帳</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--sub:#6b7385;--line:#e3e6ec;--ac:#2f5bd8;--pl:#0f8a4f;--mi:#d23b3b;--plb:#e4f5ec;--mib:#fbe7e7;--hd:#8e2fc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--tx:#e8ebf2;--sub:#98a1b3;--line:#2d3340;--ac:#6f93ff;--pl:#47c98a;--mi:#ff7b7b;--plb:#173a2a;--mib:#432326;--hd:#d39bff}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--tx:#e8ebf2;--sub:#98a1b3;--line:#2d3340;--ac:#6f93ff;--pl:#47c98a;--mi:#ff7b7b;--plb:#173a2a;--mib:#432326;--hd:#d39bff}
*{box-sizing:border-box}
button{font-family:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px;zoom:var(--z,1)}
html[data-fs="m"]{--z:1.15}
html[data-fs="l"]{--z:1.3}
.cal{zoom:calc(1 / var(--z,1))}
h1{font-size:21px;margin:8px 0 10px}
h2{font-size:17px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:12px 2px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:15px;color:var(--sub);margin:10px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:18px}
textarea{width:100%;height:130px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
.two{display:flex;gap:8px}.two>div{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 28%;padding:13px 6px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;font-size:17px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg button.on.k-pachi{background:#d97706;border-color:#d97706}
.seg button.on.k-other{background:#64748b;border-color:#64748b}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g3 button{flex:none;min-width:0}
.seg button:disabled{opacity:.4}
.nav .sel{display:flex;gap:4px;align-items:center;font-size:18px}
select{padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font-size:18px;font-family:inherit}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dh h2{margin:0}
.dh button{border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;padding:10px 16px;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{margin:8px 0 10px}
.fsz{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--sub)}
.fsz button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:14px;font-family:inherit}
.fsz button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%}
.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:19px;font-weight:700}
.big{font-size:38px;font-weight:700;text-align:center;margin:2px 0}
.pl{color:var(--pl)}.mi{color:var(--mi)}.hd{color:var(--hd)}
.sub{color:var(--sub);font-size:15px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.nav select{padding:6px 2px;font-size:17px}
.nav .tdy{font-size:15px;padding:8px 10px;white-space:nowrap}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px;background:var(--card)}
.sugg:empty{display:none}
.sg{border:0;border-top:1px solid var(--line);background:var(--card);color:var(--tx);padding:12px;font-size:17px;text-align:left;font-family:inherit}
.sg:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:18px;padding:8px 12px;font-size:15px;font-family:inherit}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row .r .am{display:inline-block;min-width:104px;text-align:right}
.row .r small.w{display:inline-block;width:98px;text-align:left;margin-left:10px;font-size:13px;vertical-align:baseline}
.row.rl{width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--tx);font:inherit;text-align:left;padding:9px 0;cursor:pointer}
.row.rl:active{background:var(--bg)}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font-size:22px}
.nav b{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:8px}
.row.f{border-top:0}
.row .l{min-width:0}.row .r{text-align:right;white-space:nowrap}
.row small{display:block;color:var(--sub);font-size:15px}
.act button{border:0;background:none;color:var(--ac);font-size:16px;padding:8px 10px}
.empty{color:var(--sub);text-align:center;padding:14px 0}
.stat{display:flex;justify-content:space-around;margin-top:8px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{text-align:center;font-size:15px;color:var(--sub);padding:2px 0}
.cal .d{min-height:68px;border:1px solid var(--line);border-radius:8px;padding:2px 1px 3px;background:var(--bg);color:var(--tx);text-align:center;font-size:13px;overflow:hidden;container-type:inline-size}
.cal .d i{display:block;font-style:normal;font-size:17px;font-weight:600;color:var(--tx);text-align:left;padding-left:3px}
.cal .d b{display:block;font-size:11px;letter-spacing:-.4px;margin-top:4px;white-space:nowrap}
.cal .d b.sm{font-size:11px}
.cal .d.p{background:var(--plb)}.cal .d.m{background:var(--mib)}
.cal .d.t{border:2px solid var(--ac)}
.cal .d.r i{color:var(--hd)}
.cal .h.r{color:var(--hd)}
.cal .d.s{outline:2px solid var(--ac)}
.cal .e{visibility:hidden}
.pv{text-align:center;margin-top:12px;font-size:24px;font-weight:700}
</style>
</head>
<body>
<main>
<div class="top"><h1>PaSu収支帳</h1><div class="fsz" id="fsz"></div></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script>
var KEY='pachi-v1',RKEY='pachi-rates-v1',BASE={slot:['5スロ','10スロ','20スロ','ジャグラー'],pachi:['0.5パチ','1パチ','4パチ'],other:[]},DEF={slot:'10スロ',pachi:'4パチ',other:''},X={slot:[],pachi:[],other:[]},KINDS=['slot','pachi','other'],RATES={},E=[];
try{var xr=JSON.parse(localStorage.getItem(RKEY)||'{}');KINDS.forEach(function(k){if(Array.isArray(xr[k]))X[k]=xr[k].map(String).slice(0,30).filter(function(r){return BASE[k].indexOf(r)<0})})}catch(e){}
function syncRates(){KINDS.forEach(function(k){var l=BASE[k].slice();X[k].forEach(function(r){if(l.indexOf(r)<0)l.push(r)});l.sort(function(a,b){var x=parseFloat(a),y=parseFloat(b);if(isNaN(x)&&isNaN(y))return 0;if(isNaN(x))return 1;if(isNaN(y))return -1;return x-y});RATES[k]=l})}
syncRates();
function saveRates(){try{localStorage.setItem(RKEY,JSON.stringify(X))}catch(e){}}
var ST={fs:'s',limit:0,last:''};
try{var sj=JSON.parse(localStorage.getItem('pachi-set-v1')||'{}');if(sj.fs)ST.fs=sj.fs;ST.limit=Number(sj.limit)||0;ST.last=sj.last||''}catch(e){}
function saveST(){try{localStorage.setItem('pachi-set-v1',JSON.stringify(ST))}catch(e){}}
function applyFs(){document.documentElement.setAttribute('data-fs',ST.fs)}
applyFs();
try{E=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){E=[]}
E.forEach(function(e){if(e.inv===undefined){e.inv=e.amount<0?-e.amount:0;e.rec=e.amount>0?e.amount:0}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(E))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var blank=function(){return{store:'',kind:'slot',rate:'10スロ',inv:'',rec:'',memo:''}};
var S={tab:'cal',ym:today().slice(0,7),y:today().slice(0,4),sel:today(),edit:null,f:blank()};
function yen(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString()+'円'}
function sh(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString()}
function cls(n){return n>0?'pl':n<0?'mi':''}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sum(a,k){return a.reduce(function(s,e){return s+e[k]},0)}
function group(a,fn){var m={};a.forEach(function(e){var k=fn(e);m[k]=(m[k]||0)+e.amount});return m}
var storeCnt={};
function stores(){
  var m={};E.forEach(function(e){if(!e.store)return;(m[e.store]=m[e.store]||{})[e.date]=1});
  storeCnt={};var k=Object.keys(m);k.forEach(function(x){storeCnt[x]=Object.keys(m[x]).length});
  return k.sort(function(a,b){return storeCnt[b]-storeCnt[a]||(a<b?-1:1)});
}
var HC={};
function nthMon(y,m,n){var f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(n-1)*7}
function holidays(y){
  if(HC[y])return HC[y];
  var h={};function set(m,d,n){h[pad(m)+'-'+pad(d)]=n}
  set(1,1,'元日');
  if(y>=2000)set(1,nthMon(y,1,2),'成人の日');else set(1,15,'成人の日');
  set(2,11,'建国記念の日');
  if(y>=2020)set(2,23,'天皇誕生日');
  var k=y-1980,sh=Math.floor(20.8431+0.242194*k-Math.floor(k/4)),au=Math.floor(23.2488+0.242194*k-Math.floor(k/4));
  set(3,sh,'春分の日');
  set(4,29,'昭和の日');set(5,3,'憲法記念日');set(5,4,'みどりの日');set(5,5,'こどもの日');
  if(y===2019)set(5,1,'即位の日');
  if(y===2020)set(7,23,'海の日');else if(y===2021)set(7,22,'海の日');else if(y>=2003)set(7,nthMon(y,7,3),'海の日');
  if(y===2020)set(8,10,'山の日');else if(y===2021)set(8,8,'山の日');else if(y>=2016)set(8,11,'山の日');
  if(y>=2003)set(9,nthMon(y,9,3),'敬老の日');
  set(9,au,'秋分の日');
  if(y===2020)set(7,24,'スポーツの日');else if(y===2021)set(7,23,'スポーツの日');
  else if(y>=2020)set(10,nthMon(y,10,2),'スポーツの日');else if(y>=2000)set(10,nthMon(y,10,2),'体育の日');
  if(y===2019)set(10,22,'即位礼正殿の儀');
  set(11,3,'文化の日');set(11,23,'勤労感謝の日');
  if(y>=1989&&y<=2018)set(12,23,'天皇誕生日');
  var d,key,dt,i;
  for(d=new Date(y,0,2);d.getFullYear()===y;d=new Date(y,d.getMonth(),d.getDate()+1)){
    key=pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(h[key]||d.getDay()===0)continue;
    var pv=new Date(y,d.getMonth(),d.getDate()-1),nx=new Date(y,d.getMonth(),d.getDate()+1);
    if(h[pad(pv.getMonth()+1)+'-'+pad(pv.getDate())]&&h[pad(nx.getMonth()+1)+'-'+pad(nx.getDate())])h[key]='国民の休日';
  }
  Object.keys(h).slice().forEach(function(k2){
    var m=Number(k2.slice(0,2)),dd=Number(k2.slice(3));
    if(new Date(y,m-1,dd).getDay()===0){
      var t=new Date(y,m-1,dd+1);
      while(h[pad(t.getMonth()+1)+'-'+pad(t.getDate())])t=new Date(y,t.getMonth(),t.getDate()+1);
      if(t.getFullYear()===y)h[pad(t.getMonth()+1)+'-'+pad(t.getDate())]='振替休日';
    }
  });
  return HC[y]=h;
}
function hn(ds){return holidays(Number(ds.slice(0,4)))[ds.slice(5)]||''}
function isRed(ds){return new Date(ds+'T00:00:00').getDay()===0||!!hn(ds)}
function dow(d){return '日月火水木金土'[new Date(d+'T00:00:00').getDay()]}
function byMonth(){return E.filter(function(e){return e.date.slice(0,7)===S.ym})}

function summary(a,label){
  var t=sum(a,'amount'),dm=group(a,function(e){return e.date}),dk=Object.keys(dm),w=dk.filter(function(k){return dm[k]>0}).length;
  return '<div class="card"><div class="sub" style="text-align:center">'+label+'</div><div class="big '+cls(t)+'">'+yen(t)+'</div><div class="stat"><div><div class="sub">投資</div><b>'+sum(a,'inv').toLocaleString()+'</b></div><div><div class="sub">回収</div><b>'+sum(a,'rec').toLocaleString()+'</b></div><div><div class="sub">勝ちの日/<wbr>行った日</div><b>'+w+'/'+dk.length+'</b></div><div><div class="sub">勝率</div><b>'+(dk.length?Math.round(w/dk.length*100):0)+'%</b></div></div></div>';
}
function rowHtml(e,date){
  return '<div class="row"><div class="l"><b>'+(date?'<span class="'+(isRed(e.date)?'hd':'')+'">'+e.date.slice(5).replace('-','/')+'('+dow(e.date)+')</span> ':'')+esc(e.store||'(店舗名なし)')+'</b><small>'+(e.kind==='other'?'その他'+(e.rate?' '+esc(e.rate):''):(esc(e.rate)||(e.kind==='slot'?'スロット':'パチンコ')))+' ・ 投資'+e.inv.toLocaleString()+' / 回収'+e.rec.toLocaleString()+(e.memo?' ・ '+esc(e.memo):'')+'</small></div><div class="r"><b class="'+cls(e.amount)+'">'+yen(e.amount)+'</b><div class="act"><button data-edit="'+e.id+'">編集</button><button data-del="'+e.id+'"'+(String(S.delArm)===String(e.id)?' style="color:var(--mi);font-weight:700"':'')+'>'+(String(S.delArm)===String(e.id)?'本当に削除':'削除')+'</button></div></div></div>';
}
function wr(list){
  var dm=group(list,function(e){return e.date}),ks=Object.keys(dm),w=ks.filter(function(k){return dm[k]>0}).length;
  return ks.length?Math.round(w/ks.length*100)+'% ('+w+'/'+ks.length+'日)':'';
}
function monthTotal(a){
  var t=sum(a,'amount');
  return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px"><span class="sub" style="font-size:16px">月計</span><b class="'+cls(t)+'" style="font-size:26px">'+yen(t)+'</b></div>';
}
function breakdown(a,title,fn){
  var m=group(a,fn),k=Object.keys(m).sort(function(x,y){return m[y]-m[x]}),ls={};
  a.forEach(function(e){var kk=fn(e);(ls[kk]=ls[kk]||[]).push(e)});
  if(!k.length)return '';
  return '<div class="card"><h2>'+title+'</h2>'+k.map(function(x){return '<div class="row"><div class="l">'+esc(x)+'</div><div class="r '+cls(m[x])+'"><b class="am">'+yen(m[x])+'</b><small class="w">'+wr(ls[x])+'</small></div></div>'}).join('')+'</div>';
}
function ymLabel(){var p=S.ym.split('-');return p[0]+'年'+Number(p[1])+'月'}
function closeForm(){S.fmsg='';if(S.edit)S.f=blank();S.edit=null;S.form=false}
function yearList(){
  var ys={},c=new Date().getFullYear();ys[c]=1;ys[c+1]=1;ys[S.y]=1;ys[S.ym.slice(0,4)]=1;
  E.forEach(function(e){ys[e.date.slice(0,4)]=1});
  var a=Object.keys(ys).map(Number),mn=Math.min(Math.min.apply(null,a),c-5),mx=Math.max.apply(null,a),l=[];
  for(var y=mn;y<=mx;y++)l.push(y);return l;
}
function opts(list,cur){return list.map(function(v){return '<option value="'+v+'"'+(String(v)===String(cur)?' selected':'')+'>'+v+'</option>'}).join('')}
function calAmt(v){
  var a=Math.abs(v),sg=v<0?'−':'',t=a>=100000?sg+(Math.round(a/1000)/10)+'万':sg+a.toLocaleString(),em=0;
  t.split('').forEach(function(ch){em+=/\d/.test(ch)?.58:(ch===','||ch==='.')?.3:ch==='万'?1.05:.62});
  return '<b class="'+cls(v)+'" style="font-size:min(14px,'+(94/em).toFixed(1)+'cqw)">'+t+'</b>';
}
function norm(t){return String(t).normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+96)})}
function showSugg(){
  var el=document.getElementById('sugg'),inp=document.getElementById('f-store');if(!el||!inp)return;
  var v=inp.value.trim(),q=norm(v),l=stores();
  var r=l.filter(function(x){return x!==v&&(!q||norm(x).indexOf(q)>=0)});
  r.sort(function(a,b){var pa=q&&norm(a).indexOf(q)===0?0:1,pb=q&&norm(b).indexOf(q)===0?0:1;return pa-pb||storeCnt[b]-storeCnt[a]});
  el.innerHTML=r.slice(0,6).map(function(x){return '<button class="sg" data-sg="'+esc(x)+'">'+esc(x)+'<span class="sub"> '+storeCnt[x]+'回</span></button>'}).join('');
}
function storeList(){
  var m={};E.forEach(function(e){if(!e.store)return;var o=m[e.store]||(m[e.store]={n:0,d:''});o.n++;if(e.date>o.d)o.d=e.date});
  return Object.keys(m).sort(function(a,b){return m[b].d<m[a].d?-1:m[b].d>m[a].d?1:m[b].n-m[a].n});
}
function storeChips(cur){
  var l=storeList();if(!l.length)return '';
  var show=S.allStores?l:l.slice(0,8);
  return '<div class="chips">'+show.map(function(x){return '<button class="chip'+(cur===x?' on':'')+'" data-store="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+(l.length>8?'<button class="chip" id="stores-more">'+(S.allStores?'閉じる':'＋ すべて ('+l.length+')')+'</button>':'')+'</div>';
}
function recRow(e){
  return '<button class="row rl" data-goday="'+e.date+'" style="padding:7px 0"><div class="l"><b class="'+(isRed(e.date)?'hd':'')+'">'+e.date.slice(0,4)+'/'+Number(e.date.slice(5,7))+'/'+Number(e.date.slice(8))+'('+dow(e.date)+')</b> '+esc(e.store||'(店舗名なし)')+'<small>投資'+e.inv.toLocaleString()+' / 回収'+e.rec.toLocaleString()+(e.memo?' ・ '+esc(e.memo):'')+'</small></div><div class="r"><b class="'+cls(e.amount)+'">'+yen(e.amount)+'</b> <span class="sub">›</span></div></button>';
}
function dayList(a){
  if(!a.length)return '<div class="empty">この月の記録はありません</div>';
  var m={};a.forEach(function(e){var o=m[e.date]||(m[e.date]={t:0,i:0,r:0,n:0});o.t+=e.amount;o.i+=e.inv;o.r+=e.rec;o.n++});
  return Object.keys(m).sort().reverse().map(function(d){var o=m[d];return '<button class="row rl" data-goday="'+d+'"><div class="l"><b class="'+(isRed(d)?'hd':'')+'">'+Number(d.slice(5,7))+'/'+Number(d.slice(8))+'('+dow(d)+')</b><small>'+o.n+'件 ・ 投資'+o.i.toLocaleString()+' / 回収'+o.r.toLocaleString()+'</small></div><div class="r"><b class="'+cls(o.t)+'">'+yen(o.t)+'</b> <span class="sub">›</span></div></button>'}).join('');
}
function nav(label,id){
  var c;

  else{inv=Math.abs(parseInt(e.inv,10)||0);rec=Math.abs(parseInt(e.rec,10)||0)}
  var k=e.kind==='pachi'?'pachi':e.kind==='other'?'other':'slot';
  return{id:Number(e.id)||Date.now()+i,date:e.date,store:String(e.store||'').slice(0,60),kind:k,rate:String((e.rate===undefined||e.rate===null)?DEF[k]:e.rate),inv:inv,rec:rec,amount:rec-inv,memo:String(e.memo||'').slice(0,100)};
}
function doImport(replace){
  var txt=g('imp-text').trim();
  if(!txt)return setMsg('ファイルを選ぶか、テキストを貼り付けてください');
  var o;try{o=JSON.parse(txt)}catch(err){return setMsg('データの形式が正しくありません')}
  var arr=Array.isArray(o)?o:(o&&o.entries);
  if(!Array.isArray(arr))return setMsg('記録データが見つかりません');
  var list=[],bad=0;arr.forEach(function(e,i){var c=cleanEntry(e,i);if(c)list.push(c);else bad++});
  if(!list.length)return setMsg('読み込める記録がありませんでした');
  list.forEach(function(c){if(c.rate&&RATES[c.kind].indexOf(c.rate)<0&&X[c.kind].indexOf(c.rate)<0)X[c.kind].push(c.rate)});
  if(o&&o.rates)KINDS.forEach(function(k){if(Array.isArray(o.rates[k]))o.rates[k].forEach(function(r){r=String(r).slice(0,12);if(r&&RATES[k].indexOf(r)<0&&X[k].indexOf(r)<0)X[k].push(r)})});
  syncRates();saveRates();
  if(o&&Number(o.limit)>0){ST.limit=Number(o.limit);saveST()}
  if(replace){if(!S.repArm){S.repArm=true;var rb=document.getElementById('imp-rep');if(rb)rb.textContent='もう一度押すと置き換えます';setMsg('今の記録'+E.length+'件を消して、'+list.length+'件に置き換えます。よければ、赤いボタンをもう一度押してください');clearTimeout(S.repT);S.repT=setTimeout(function(){S.repArm=false;var b2=document.getElementById('imp-rep');if(b2)b2.textContent='全て置き換えて読み込む'},12000);return}S.repArm=false;E=list;S.msg=list.length+'件に置き換えました'}
  else{var ids={};E.forEach(function(e){ids[e.id]=1});var add=0;list.forEach(function(c){if(!ids[c.id]){ids[c.id]=1;E.push(c);add++}});S.msg=add+'件を追加しました(重複'+(list.length-add)+'件は除外)'}
  if(bad)S.msg+=' / 形式不正'+bad+'件は無視';
  save();render();
}
function markSaved(t){ST.last=today();saveST();setMsg(t)}
function backupName(ext){return 'syushi-'+today().replace(/-/g,'')+'.'+ext}
async function expFile(){
  var data=payload();
  try{
    var dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use('downloads'):null}catch(e){dl=null}
    if(dl){await dl.save({filename:backupName('json'),data:data});return markSaved('保存しました')}
  }catch(err){
    if(err&&err.code==='declined')return setMsg('キャンセルしました');
  }
  try{
    var url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');
    a.href=url;a.download=backupName('json');document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},5000);
    return markSaved('ダウンロードを開始しました。保存されないときは「共有で保存」か「テキストで表示」を使ってください');
  }catch(err2){}
  setMsg('この画面ではファイル保存が使えません。「共有で保存」か「テキストで表示」を使ってください');
}
async function expShare(){
  var data=payload();
  try{
    var f=new File([data],backupName('txt'),{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'PaSu収支帳 バックアップ'});return markSaved('共有しました')}
    if(navigator.share){await navigator.share({title:'PaSu収支帳 バックアップ',text:data});return markSaved('共有しました')}
    setMsg('この端末では共有が使えません。「テキストで表示」を使ってください');
  }catch(err){
    setMsg(err&&err.name==='AbortError'?'キャンセルしました':'共有できませんでした。「テキストで表示」を使ってください');
  }
}
document.addEventListener('change',function(e){
  var id=e.target.id;S.openRate=null;
  if(id==='sel-y'||id==='sel-m'){S.ym=g('sel-y')+'-'+pad(Number(g('sel-m')));S.sel=null;closeForm();return render()}
  if(id==='sel-yy'){S.y=g('sel-yy');return render()}
  if(id!=='imp-file')return;var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){document.getElementById('imp-text').value=r.result;setMsg(f.name+' を読み込みました。下のボタンで取り込みを実行してください')};r.readAsText(f);
});
function render(){
  document.getElementById('fsz').innerHTML='文字'+[['s','小'],['m','中'],['l','大']].map(function(x){return '<button data-fs="'+x[0]+'" class="'+(ST.fs===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
  document.getElementById('tabs').innerHTML=[['cal','カレンダー'],['an','収支分析'],['dt','データ']].map(function(x){return '<button data-t="'+x[0]+'" class="'+(S.tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
  document.getElementById('view').innerHTML=S.tab==='cal'?viewCal():S.tab==='an'?viewAn():viewData();
  pv();
}
function g(i){var x=document.getElementById(i);return x?x.value:''}
function readForm(){if(!document.getElementById('f-store'))return;S.f.store=g('f-store');S.f.inv=g('f-inv');S.f.rec=g('f-rec');S.f.memo=g('f-memo');if(document.getElementById('f-date'))S.f.date=g('f-date')}
function pv(){var x=document.getElementById('pv');if(!x)return;var v=(parseInt(g('f-rec'),10)||0)-(parseInt(g('f-inv'),10)||0);x.textContent=yen(v);x.className=cls(v)}
document.addEventListener('input',function(e){var id=e.target.id;if(id==='f-inv'||id==='f-rec')pv();if(id==='f-store')showSugg()});
document.addEventListener('focusin',function(e){if(e.target.id==='f-store')showSugg()});
document.addEventListener('focusout',function(e){if(e.target.id==='f-store')setTimeout(function(){var el=document.getElementById('sugg');if(el)el.innerHTML=''},400)});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;var d=b.dataset;if(!d.del)S.delArm=null;if(!d.orate)S.openRate=null;
  if(d.t){readForm();S.tab=d.t;return render()}
  if(d.an){S.an=d.an;return render()}
  if(d.fs){ST.fs=d.fs;saveST();applyFs();return render()}
  if(b.id==='bk-go'){S.tab='dt';return render()}
  if(b.id==='bk-later'){S.hideBk=true;return render()}
  if(b.id==='lim-open'){S.limEdit=true;render();var li=document.getElementById('f-limit');if(li)li.focus();return}
  if(b.id==='lim-save'){ST.limit=Math.max(0,parseInt(g('f-limit'),10)||0);saveST();S.limEdit=false;return render()}
  if(b.id==='lim-cancel'){S.limEdit=false;return render()}
  if(b.id==='open-form'){S.form=true;render();var fs=document.getElementById('f-store');if(fs)fs.scrollIntoView({block:'center'});return}
  if(d.day){readForm();closeForm();S.sel=d.day;return render()}
  if(d.kind){readForm();S.f.kind=d.kind;S.f.rate=DEF[d.kind];return render()}
  if(b.id==='rate-open'){readForm();S.addRate=!S.addRate;render();var ni=document.getElementById('f-newrate');if(ni)ni.focus();return}
  if(b.id==='rate-add'){
    readForm();var nm=g('f-newrate').trim().slice(0,12);if(!nm)return;
    if(/^[0-9.]+$/.test(nm)&&S.f.kind!=='other')nm+=S.f.kind==='slot'?'スロ':'パチ';
    if(RATES[S.f.kind].indexOf(nm)<0){X[S.f.kind].push(nm);syncRates();saveRates()}
    S.f.rate=nm;S.addRate=false;return render();
  }
  if(b.id==='rate-del'){readForm();var k2=S.f.kind,r2=S.f.rate;if(X[k2].indexOf(r2)<0)return;X[k2]=X[k2].filter(function(r){return r!==r2});syncRates();saveRates();S.f.rate=DEF[k2];return render()}
  if(d.delrate){readForm();var kk=S.f.kind;X[kk]=X[kk].filter(function(r){return r!==d.delrate});syncRates();saveRates();if(S.f.rate===d.delrate)S.f.rate=DEF[kk];return render()}
  if(d.rate){readForm();S.f.rate=(S.f.kind==='other'&&S.f.rate===d.rate)?'':d.rate;return render()}
  if(d.orate){S.openRate=(S.openRate===d.orate)?null:d.orate;return render()}
  if(d.sg!==undefined){var si=document.getElementById('f-store');if(si)si.value=d.sg;S.f.store=d.sg;var sg=document.getElementById('sugg');if(sg)sg.innerHTML='';return}
  if(d.store){readForm();S.f.store=(S.f.store===d.store)?'':d.store;return render()}
  if(b.id==='stores-more'){readForm();S.allStores=!S.allStores;return render()}
  if(d.today){if(d.today==='mo'){S.ym=today().slice(0,7);S.sel=today();closeForm()}else S.y=today().slice(0,4);return render()}
  if(d.goday){readForm();closeForm();S.tab='cal';S.ym=d.goday.slice(0,7);S.sel=d.goday;render();var dc=document.getElementById('daycard');if(dc)dc.scrollIntoView({block:'center'});return}
  if(d.gomonth){S.tab='an';S.an='mo';S.ym=d.gomonth;S.sel=null;closeForm();render();window.scrollTo(0,0);return}
  if(d.goyear){S.tab='an';S.an='yr';S.y=d.goyear;render();window.scrollTo(0,0);return}
  if(d.nav){
    var n=Number(d.nav);
    if(d['for']==='mo'){var p=S.ym.split('-'),dt=new Date(Number(p[0]),Number(p[1])-1+n,1);S.ym=dt.getFullYear()+'-'+pad(dt.getMonth()+1);S.sel=null;closeForm()}
    else S.y=String(Number(S.y)+n);
    return render();
  }
  if(d.del){if(String(S.delArm)===d.del){S.delArm=null;E=E.filter(function(e){return String(e.id)!==d.del});closeForm();save();render()}else{S.delArm=d.del;render()}return}
  if(d.edit){
    var e=E.filter(function(x){return String(x.id)===d.edit})[0];if(!e)return;
    S.edit=e.id;S.form=true;S.f={date:e.date,store:e.store,kind:e.kind,rate:e.rate,inv:e.inv,rec:e.rec,memo:e.memo||''};
    S.ym=e.date.slice(0,7);S.sel=e.date;S.tab='cal';render();
    var f=document.getElementById('f-store');if(f)f.scrollIntoView({block:'center'});return;
  }
  if(b.id==='exp-file')return expFile();
  if(b.id==='exp-show'){S.showExp=true;ST.last=today();saveST();render();var t=document.getElementById('exp-text');if(t){t.focus();t.select();try{navigator.clipboard.writeText(t.value).then(function(){setMsg('コピーしました')},function(){})}catch(err){}}return}
  if(b.id==='exp-share')return expShare();
  if(b.id==='imp-add')return doImport(false);
  if(b.id==='imp-rep')return doImport(true);
  if(b.id==='cancel'){closeForm();return render()}
  if(b.id==='add'){
    readForm();var f=S.f,inv=Math.abs(parseInt(f.inv,10)||0),rec=Math.abs(parseInt(f.rec,10)||0);
    if(!inv&&!rec){S.fmsg='投資額か回収額を入力してください';return render()}
    var r={id:S.edit||Date.now(),date:(S.edit&&/^\d{4}-\d{2}-\d{2}$/.test(f.date||''))?f.date:S.sel,store:f.store.trim(),kind:f.kind,rate:f.rate,inv:inv,rec:rec,amount:rec-inv,memo:(f.memo||'').trim()};
    if(S.edit){E=E.map(function(x){return x.id===S.edit?r:x})}else E.push(r);
    save();S.fmsg='';S.edit=null;S.form=false;S.ym=r.date.slice(0,7);S.sel=r.date;S.f={store:r.store,kind:r.kind,rate:r.rate,inv:'',rec:'',memo:''};render();
  }
});
render();
</script>
